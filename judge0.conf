################################################################################
# Judge0 v1.13.0 — Configuration File
# Place this file alongside docker-compose.yml in the project root.
# Documentation: https://github.com/judge0/judge0/blob/master/CHANGELOG.md
################################################################################

# ── PostgreSQL ────────────────────────────────────────────────────────────────
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=YourStrongPassword123!

# ── Redis ─────────────────────────────────────────────────────────────────────
REDIS_PASSWORD=YourRedisPassword123!

# ── Judge0 Server ─────────────────────────────────────────────────────────────
# Database connection (must match Postgres credentials above)
DATABASE_HOST=db
DATABASE_NAME=judge0
DATABASE_USERNAME=judge0
DATABASE_PASSWORD=YourStrongPassword123!
DATABASE_PORT=5432

# Redis connection (must match Redis password above)
REDIS_HOST=redis
REDIS_PORT=6379
PASSWORD=YourRedisPassword123!

# ── Execution Limits ──────────────────────────────────────────────────────────
# Maximum wall-clock seconds allowed for a submission
MAX_CPU_TIME_LIMIT=5
MAX_WALL_TIME_LIMIT=10
MAX_MEMORY_LIMIT=262144

# Default limits (applied when submission does not specify its own)
CPU_TIME_LIMIT=5
WALL_TIME_LIMIT=10
MEMORY_LIMIT=262144

# ── Security & Workers ────────────────────────────────────────────────────────
# Number of concurrent worker processes
WORKERS=2

# Allow only the listed origins (set to * to allow all during local dev)
ALLOW_ORIGIN=*

# Disable authentication token requirement for local dev
AUTHN_HEADER=
AUTHN_TOKEN=

# ── Submission Behaviour ─────────────────────────────────────────────────────
# Enable ?wait=true so submissions block until the result is ready
ENABLE_WAIT_RESULT=true

# Maximum number of submissions that can be queued
MAX_QUEUE_SIZE=100
